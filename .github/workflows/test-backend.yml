name: Backend tests and disposable integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Service containers require Linux; all records are disposable test data.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grupo_jadson_ci
          POSTGRES_USER: gj_ci
          POSTGRES_PASSWORD: gj_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gj_ci -d grupo_jadson_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gj_ci:gj_ci_only@127.0.0.1:5432/grupo_jadson_ci
      REDIS_URL: redis://127.0.0.1:6379
      QUEUE_DRIVER: redis
      API_HOST: 127.0.0.1
      API_PORT: 3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned tools
        run: |
          node --version
          test "$(pnpm --version)" = "9.15.0"
      - name: Install frozen dependencies
        run: |
          test -f pnpm-lock.yaml || { echo "Approved pnpm-lock.yaml is required." >&2; exit 1; }
          pnpm install --frozen-lockfile
      - name: Run backend unit tests
        run: pnpm --filter @grupo-jadson/backend exec jest --runInBand --json --outputFile="$GITHUB_WORKSPACE/backend-unit-results.json"
      - name: Build backend
        run: pnpm --filter @grupo-jadson/backend build
      - name: Start API against disposable services
        shell: bash
        run: |
          node apps/backend/dist/main.js > backend-integration.log 2>&1 &
          echo "$!" > backend.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3333/api/v1/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat backend-integration.log
          exit 1
      - name: Verify database migrations and persisted endpoints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const base = 'http://127.0.0.1:3333/api/v1';
          const call = async (path, options = {}) => {
            const response = await fetch(base + path, { ...options, headers: { 'content-type': 'application/json', ...options.headers } });
            const text = await response.text();
            if (!response.ok) throw new Error(path + ' returned ' + response.status + ': ' + text);
            return text ? JSON.parse(text) : null;
          };
          const health = await call('/health');
          assert.equal(health.dependencies.postgres, 'connected');
          assert.equal(health.dependencies.redis, 'connected');
          assert.equal(health.dependencies.queue.driver, 'redis');
          await call('/providers');
          const agent = await call('/agents', {
            method: 'POST',
            body: JSON.stringify({ name: 'CI integration agent', description: 'Disposable', instructions: 'Test only', model: 'test-model', enabled: true }),
          });
          const conversation = await call('/conversations', {
            method: 'POST',
            body: JSON.stringify({ title: 'CI persistence check', agentId: agent.id }),
          });
          await call('/conversations/' + conversation.id + '/messages', {
            method: 'POST',
            body: JSON.stringify({ role: 'user', content: 'persisted in disposable CI database' }),
          });
          const [agents, conversations] = await Promise.all([call('/agents'), call('/conversations')]);
          assert.ok(agents.some((item) => item.id === agent.id));
          const stored = conversations.find((item) => item.id === conversation.id);
          assert.ok(stored);
          assert.equal(stored.agentId, agent.id);
          assert.ok(stored.messages.some((item) => item.content === 'persisted in disposable CI database'));
          writeFileSync('backend-integration-results.json', JSON.stringify({
            status: 'passed', postgres: health.dependencies.postgres, redis: health.dependencies.redis,
            queue: health.dependencies.queue.driver, migrationApplied: true,
            agentReadAfterWrite: true, conversationAndMessageReadAfterWrite: true, providersEndpoint: 'responded',
          }, null, 2));
          NODE
      - name: Stop API process
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" 2>/dev/null || true; fi
      - name: Upload test and integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ github.sha }}-linux-x64
          path: |
            backend-unit-results.json
            backend-integration-results.json
            backend-integration.log
          if-no-files-found: ignore
          retention-days: 14
