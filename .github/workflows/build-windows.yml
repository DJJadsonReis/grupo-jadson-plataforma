name: Windows desktop build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Prepare MSVC and Windows SDK environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust stable for MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Confirm Windows native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC compiler missing on runner.' }
          if (-not (Get-Command rc.exe -ErrorAction SilentlyContinue)) { throw 'Windows SDK resource compiler missing on runner.' }
          rustc --version
          cargo --version
      - name: Install workspace dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path pnpm-lock.yaml)) { throw 'pnpm-lock.yaml ausente. Gere, revise e commite o lockfile antes do build.' }
          pnpm install --frozen-lockfile
      - name: Check TypeScript types
        run: pnpm typecheck
      - name: Run required backend tests
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/backend exec jest --runInBand --json --outputFile="$env:GITHUB_WORKSPACE/backend-test-results.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run required frontend tests
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/desktop exec vitest run --reporter=json --outputFile="$env:GITHUB_WORKSPACE/desktop-test-results.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend
        run: pnpm --filter @grupo-jadson/desktop build
      - name: Build backend
        run: |
          pnpm --filter @grupo-jadson/backend build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Build Tauri Windows installers
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/desktop build:desktop *> windows-build.log
          $result = $LASTEXITCODE
          Get-Content windows-build.log
          if ($result -ne 0) { exit $result }
      - name: Upload CI test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            backend-test-results.json
            desktop-test-results.json
            windows-build.log
            pnpm-lock.yaml
          if-no-files-found: ignore
      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-jadson-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
