name: Windows Tauri build
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-tauri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-integration:
    uses: ./.github/workflows/test-backend.yml
    permissions:
      contents: read
  build:
    needs: backend-integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust stable for MSVC x64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          rustup target list --installed
          if ((pnpm --version) -ne '9.15.0') { throw 'Expected pnpm 9.15.0.' }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) { throw 'MSVC compiler missing.' }
          if (-not (Get-Command rc.exe -ErrorAction SilentlyContinue)) { throw 'Windows SDK resource compiler missing.' }
          if (-not ((rustup target list --installed) -contains 'x86_64-pc-windows-msvc')) { throw 'Rust MSVC x64 target missing.' }
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application")
          if (-not ($roots | Where-Object { Test-Path -LiteralPath $_ })) { throw 'WebView2 Runtime missing on runner.' }
      - name: Install frozen dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path pnpm-lock.yaml)) { throw 'Approved pnpm-lock.yaml is required before Windows builds.' }
          pnpm install --frozen-lockfile
      - name: Record build metadata
        id: metadata
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          @(
            "product_version=$($config.version)"
            "commit=${{ github.sha }}"
            "architecture=x64"
            "node=$(node --version)"
            "pnpm=$(pnpm --version)"
            "rust=$(rustc --version)"
            "cargo=$(cargo --version)"
          ) | Set-Content -LiteralPath build-metadata.txt -Encoding utf8
          "version=$($config.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Run typecheck
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          $result = $LASTEXITCODE
          Get-Content typecheck.log
          if ($result -ne 0) { exit $result }
      - name: Run desktop tests
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/desktop exec vitest run --reporter=json --outputFile="$env:GITHUB_WORKSPACE/desktop-test-results.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build backend
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/backend build *> backend-build.log
          $result = $LASTEXITCODE
          Get-Content backend-build.log
          if ($result -ne 0) { exit $result }
      - name: Build frontend and installers using Tauri
        shell: pwsh
        run: |
          pnpm --filter @grupo-jadson/desktop build *> frontend-build.log
          $result = $LASTEXITCODE
          Get-Content frontend-build.log
          if ($result -ne 0) { exit $result }
          pnpm --filter @grupo-jadson/desktop exec tauri build --bundles msi,nsis *> tauri-build.log
          $result = $LASTEXITCODE
          Get-Content tauri-build.log
          if ($result -ne 0) { exit $result }
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi -Filter '*.msi' -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $msi) { throw 'No MSI installer generated.' }
          if (-not $nsis) { throw 'No NSIS installer generated.' }
          if (-not (Test-Path apps/desktop/dist/index.html)) { throw 'Frontend output is missing.' }
      - name: Upload logs and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}-windows-x64
          path: |
            typecheck.log
            desktop-test-results.json
            frontend-build.log
            backend-build.log
            tauri-build.log
            build-metadata.txt
            pnpm-lock.yaml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload frontend output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-jadson-frontend-v${{ steps.metadata.outputs.version }}-${{ github.sha }}-windows-x64
          path: |
            apps/desktop/dist/**
            build-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload backend output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-jadson-backend-v${{ steps.metadata.outputs.version }}-${{ github.sha }}-windows-x64
          path: |
            apps/backend/dist/**
            build-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload MSI and NSIS installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-jadson-installers-v${{ steps.metadata.outputs.version }}-${{ github.sha }}-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            build-metadata.txt
          if-no-files-found: error
          retention-days: 90
