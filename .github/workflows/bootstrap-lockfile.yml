name: Bootstrap pnpm lockfile
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bootstrap-lockfile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Verify pinned tools
        shell: bash
        run: |
          node --version
          test "$(pnpm --version)" = "9.15.0"
      - name: Resolve lockfile without package scripts
        shell: bash
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          test -f pnpm-lock.yaml
          git diff --exit-code HEAD -- package.json apps packages
          {
            echo "commit=${{ github.sha }}"
            echo "branch=${{ github.ref_name }}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > lockfile-review.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-review-${{ github.sha }}
          path: |
            pnpm-lock.yaml
            lockfile-review.txt
          if-no-files-found: error
          retention-days: 14
