name: TypeScript checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Install workspace dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path pnpm-lock.yaml)) { throw 'pnpm-lock.yaml ausente. Execute o workflow Generate pnpm lockfile, revise e commit o artifact antes da validação.' }
          pnpm install --frozen-lockfile
      - name: Check TypeScript types
        shell: pwsh
        run: |
          pnpm typecheck *> typecheck.log
          $result = $LASTEXITCODE
          Get-Content typecheck.log
          if ($result -ne 0) { exit $result }
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: |
            typecheck.log
            pnpm-lock.yaml
          if-no-files-found: ignore
