name: Generate pnpm lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Generate lockfile without running package scripts
        shell: pwsh
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-review
          path: pnpm-lock.yaml
          if-no-files-found: error
