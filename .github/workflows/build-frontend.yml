name: Frontend tests and build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned tools
        shell: bash
        run: |
          node --version
          test "$(pnpm --version)" = "9.15.0"
      - name: Install frozen dependencies
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Run desktop tests
        shell: bash
        run: |
          pnpm --filter @grupo-jadson/desktop exec vitest run --reporter=json --outputFile="$GITHUB_WORKSPACE/desktop-test-results.json"
      - name: Build frontend
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @grupo-jadson/desktop build 2>&1 | tee frontend-build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs-${{ github.sha }}-windows-x64
          path: |
            desktop-test-results.json
            frontend-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload frontend output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grupo-jadson-frontend-${{ github.sha }}-windows-x64
          path: apps/desktop/dist/**
          if-no-files-found: error
          retention-days: 30
