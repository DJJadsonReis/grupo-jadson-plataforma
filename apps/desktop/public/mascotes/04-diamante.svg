<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="512" height="512">
  <style>
  .float { animation: gj-float 3.2s ease-in-out infinite; }
  .eye { transform-box: fill-box; transform-origin: center; animation: gj-blink 4.5s infinite; }
  .badge { transform-box: fill-box; transform-origin: center; animation: gj-pulse 2.4s ease-in-out infinite; }
  @keyframes gj-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes gj-blink { 0%, 90%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.1); } }
  @keyframes gj-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .float, .eye, .badge { animation: none; } }
</style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D9DE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A6"/>
      <stop offset=".45" stop-color="#FFC928"/>
      <stop offset="1" stop-color="#B87500"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <ellipse cx="56" cy="101" rx="35" ry="4.5" fill="#D99A12" opacity=".35" filter="url(#shadow)"/>
  <g class="float">
  <g fill="url(#body)" stroke="#111116" stroke-width="5" stroke-linejoin="round">
    <path d="M56 13 L98 53 L56 95 L14 53Z"/>
  </g>
  <path d="M44 18 C39 9 48 4 53 11 C57 1 70 5 67 17 C62 22 52 24 44 18Z"
        fill="url(#gold)" stroke="#17130B" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="eye" d="M38 49 Q43 43 48 50" fill="none" stroke="#111116" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse class="eye" cx="68" cy="48" rx="4.5" ry="7" fill="#111116"/>
  <path d="M48 64 Q57 74 67 63" fill="none" stroke="#111116" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M29 63 l5 -4 M34 67 l5 -4 M77 63 l5 -4 M82 67 l5 -4"
        stroke="#E98B82" stroke-width="3.5" stroke-linecap="round"/>
  <g class="badge">
  <circle cx="83" cy="83" r="11" fill="#171717" stroke="url(#gold)" stroke-width="2.5"/>
  <text x="83" y="86.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">GJ</text>
  </g>
  </g>
</svg>